<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLL-E-Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <img src="logo.webp" alt="LLL-E-Book logo" class="logo">
    </div>
    <h1 class="app-title">LLL-E-BOOK</h1>
    <div class="header-actions">
      <label class="lang-wrap">
        <span class="sr-only">Language</span>
        <select id="lang-select" class="lang-select" aria-label="Language"></select>
      </label>
      <button id="upload-btn" class="btn primary" type="button" data-i18n="header.upload">Upload</button>
      <input type="file" id="file-input"
             accept=".pdf,.epub,.fb2,.cbz,.cbr,.txt,.html,.htm,.rtf"
             multiple hidden>
    </div>
  </header>

  <main>
    <!-- Library view -->
    <section id="library-view">
      <h2 class="section-title" data-i18n="library.title">Your Library</h2>
      <p class="section-subtitle" data-i18n="library.subtitle">A quiet shelf for the books you've opened.</p>
      <div id="library-list" class="library-list"></div>
    </section>

    <!-- Reader view -->
    <section id="reader-view" class="hidden">
      <div class="reader-header">
        <div class="reader-title-row">
          <span id="book-title" class="book-title"></span>
        </div>
        <div class="reader-toolbar">
          <button id="close-btn" class="btn btn-home" type="button" title="Back to library" data-i18n-title="tooltip.back">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
            <span class="btn-label" data-i18n="nav.home">Library</span>
          </button>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <div class="toolbar-group">
            <button id="prev-btn" class="btn btn-icon" type="button" title="Previous" data-i18n-title="tooltip.prev" aria-label="Previous">
              <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="next-btn" class="btn btn-icon" type="button" title="Next" data-i18n-title="tooltip.next" aria-label="Next">
              <svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <div class="toolbar-group">
            <button id="font-minus" class="btn btn-icon btn-text" type="button" title="Decrease font size" data-i18n-title="tooltip.font_down" aria-label="Decrease font size">A−</button>
            <button id="font-plus" class="btn btn-icon btn-text" type="button" title="Increase font size" data-i18n-title="tooltip.font_up" aria-label="Increase font size">A+</button>
          </div>
          <div class="toolbar-group">
            <button id="theme-toggle" class="btn btn-icon" type="button" title="Toggle theme" data-i18n-title="tooltip.theme" aria-label="Toggle theme">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <button id="bookmark-btn" class="btn btn-icon" type="button" title="Bookmark this location" data-i18n-title="tooltip.bookmark" aria-label="Bookmark this location" aria-pressed="false">
              <svg class="icon icon-fill" viewBox="0 0 24 24"><path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V20l-6-4-6 4V4.5z"/></svg>
            </button>
            <button id="toc-toggle" class="btn btn-icon" type="button" title="Table of contents" data-i18n-title="tooltip.toc" aria-label="Table of contents">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h1M3 12h1M3 18h1"/><path d="M8 6h13M8 12h13M8 18h13"/></svg>
            </button>
          </div>
          <span id="progress-label" class="progress-label"></span>
          <div id="page-jump" class="page-jump" style="display:none">
            <input id="page-input" type="number" min="1" class="page-input" aria-label="Go to page" />
            <span class="page-total"> / <span id="page-total">0</span></span>
            <input id="page-slider" type="range" min="0" max="100" value="0" class="page-slider" aria-label="Progress" />
          </div>
        </div>
      </div>

      <div class="reader-body">
        <aside id="toc-panel" class="toc-panel">
          <h3 data-i18n="toc.title">Table of Contents</h3>
          <div id="toc-list"><p class="empty" data-i18n="toc.empty">TOC not available for this format yet.</p></div>
          <div class="panel-section">
            <h3 data-i18n="bookmarks.title">Bookmarks</h3>
            <div id="bookmark-list"><p class="empty" data-i18n="bookmarks.empty">No bookmarks yet.</p></div>
          </div>
        </aside>
        <div id="book-container" class="reader-content"></div>
      </div>
    </section>
  </main>

  <!-- CDN libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <!-- unrar-wasm removed: node-unrar-js requires ESM + WASM fetch (not compatible with file://) -->

  <!-- App scripts (load in dependency order; no ES modules so this works on file://) -->
  <script src="js/storage.js"></script>
  <script src="js/file-loader.js"></script>
  <script src="js/renderers/text.js"></script>
  <script src="js/renderers/pdf.js"></script>
  <script src="js/renderers/epub.js"></script>
  <script src="js/renderers/comic.js"></script>
  <script src="js/renderers/fb2.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/stored-books.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
