<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLL-E-Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <img src="logo.webp" alt="LLL-E-Book logo" class="logo">
      <!-- Reader-only home button mirroring the logo slot. Hidden in the
           library via CSS (body.reader-active toggles logo vs. this). -->
      <button id="header-home-btn" class="btn btn-home" type="button" title="Back to library" data-i18n-title="tooltip.back">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        <span class="btn-label" data-i18n="nav.home">Library</span>
      </button>
    </div>
    <h1 class="app-title"><span class="app-title-text">LLL-E-BOOK</span><span id="header-book-title" class="header-book-title"></span></h1>
    <div class="header-actions">
      <label class="lang-wrap">
        <span class="sr-only">Language</span>
        <select id="lang-select" class="lang-select" aria-label="Language"></select>
      </label>
      <button id="upload-btn" class="btn primary" type="button" data-i18n="header.upload">Upload</button>
      <input type="file" id="file-input"
             accept=".pdf,.epub,.fb2,.cbz,.txt,.html,.htm,.rtf"
             multiple hidden>
    </div>
  </header>

  <main>
    <!-- Library view -->
    <section id="library-view">
      <h2 class="section-title" data-i18n="library.title">Your Library</h2>
      <p class="section-subtitle" data-i18n="library.subtitle">A quiet shelf for the books you've opened.</p>
      <div class="library-controls">
        <input id="library-search" type="search" class="library-search" data-i18n-placeholder="library.search_placeholder" placeholder="Search titles and authors…" />
        <label class="library-control-label"><span data-i18n="library.sort_label">Sort</span>
          <select id="library-sort" class="library-select">
            <option value="recent" data-i18n="library.sort_recent">Recently opened</option>
            <option value="title" data-i18n="library.sort_title">Title (A–Z)</option>
            <option value="author" data-i18n="library.sort_author">Author (A–Z)</option>
            <option value="progress" data-i18n="library.sort_progress">Reading progress</option>
          </select>
        </label>
        <label class="library-control-label"><span data-i18n="library.format_label">Format</span>
          <select id="library-format" class="library-select">
            <option value="all" data-i18n="library.format_all">All formats</option>
            <option value="pdf" data-i18n="format.pdf">PDF</option>
            <option value="epub" data-i18n="format.epub">EPUB</option>
            <option value="txt" data-i18n="format.txt">Text</option>
            <option value="fb2" data-i18n="format.fb2">FB2</option>
          </select>
        </label>
      </div>
      <div id="library-list" class="library-list"></div>
    </section>

    <!-- Reader view -->
    <section id="reader-view" class="hidden">
      <div class="reader-header">
        <div class="reader-title-row">
          <!-- Home button sits in the sticky title row, left of the book
               title. Absolute at the row's left edge, so the title stays
               centred whether or not it is shown. The zoom slider used to
               float at the row's right edge; it now lives in the toolbar
               (.reader-toolbar) below, so this row holds only the home
               button and the title. -->
          <button id="close-btn" class="btn btn-home" type="button" title="Back to library" data-i18n-title="tooltip.back">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
            <span class="btn-label" data-i18n="nav.home">Library</span>
          </button>
          <span id="book-title" class="book-title"></span>
        </div>
        <div class="reader-toolbar" id="reader-toolbar">
          <div class="toolbar-group toolbar-nav">
            <button id="prev-btn" class="btn btn-icon" type="button" title="Previous" data-i18n-title="tooltip.prev" aria-label="Previous">
              <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="next-btn" class="btn btn-icon" type="button" title="Next" data-i18n-title="tooltip.next" aria-label="Next">
              <svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <!-- Zoom slider group: moved out of the sticky title row into the
               toolbar, right after the page-turn group and before the PDF
               presets (DOM order = display order: nav → zoom slider →
               Fit/W/1:1 → A−/A+ → …). JS only ever toggles its inline
               display (flex/none, PDF/CBZ only). -->
          <div class="toolbar-group" id="zoom-slider-group" style="display:none">
            <input type="range" id="zoom-slider" min="50" max="400" value="100" step="10" class="zoom-slider" aria-label="Zoom level" />
            <span id="zoom-percentage" class="zoom-percentage">100%</span>
          </div>
          <div class="toolbar-group" id="pdf-zoom-group" style="display:none">
            <button id="zoom-fit-page" class="btn btn-icon btn-text is-active" type="button" title="Fit page" aria-label="Fit page">Fit</button>
            <button id="zoom-fit-width" class="btn btn-icon btn-text" type="button" title="Fit width" aria-label="Fit width">W</button>
            <button id="zoom-100" class="btn btn-icon btn-text" type="button" title="Original size" aria-label="Original size">1:1</button>
          </div>
          <div class="toolbar-group">
            <button id="font-minus" class="btn btn-icon btn-text" type="button" title="Decrease font size" data-i18n-title="tooltip.font_down" aria-label="Decrease font size">A−</button>
            <button id="font-plus" class="btn btn-icon btn-text" type="button" title="Increase font size" data-i18n-title="tooltip.font_up" aria-label="Increase font size">A+</button>
          </div>
          <div class="toolbar-group theme-group" role="radiogroup" aria-label="Theme">
            <button id="theme-light" class="btn btn-icon" type="button" role="radio" aria-checked="false" title="Light theme" data-i18n-title="tooltip.theme_light" aria-label="Light theme">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button id="theme-sepia" class="btn btn-icon" type="button" role="radio" aria-checked="false" title="Sepia theme" data-i18n-title="tooltip.theme_sepia" aria-label="Sepia theme">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="theme-dark" class="btn btn-icon" type="button" role="radio" aria-checked="false" title="Dark theme" data-i18n-title="tooltip.theme_dark" aria-label="Dark theme">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
          </div>
          <div class="toolbar-group">
            <button id="bookmark-btn" class="btn btn-icon" type="button" title="Bookmark this location" data-i18n-title="tooltip.bookmark" aria-label="Bookmark this location" aria-pressed="false">
              <svg class="icon icon-fill" viewBox="0 0 24 24"><path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V20l-6-4-6 4V4.5z"/></svg>
            </button>
            <button id="highlight-btn" class="btn btn-icon" type="button" title="Highlight selected text" data-i18n-title="tooltip.highlight" aria-label="Highlight selected text" aria-pressed="false" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12l8-8 4 4-8 8z"/><path d="M8 12l-4 4v4h4l4-4"/><path d="M13 7l4 4"/></svg>
            </button>
            <button id="toc-toggle" class="btn btn-icon" type="button" title="Table of contents" data-i18n-title="tooltip.toc" aria-label="Table of contents">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h1M3 12h1M3 18h1"/><path d="M8 6h13M8 12h13M8 18h13"/></svg>
            </button>
          </div>
          <span id="progress-label" class="progress-label"></span>
          <div id="page-jump" class="page-jump" style="display:none">
            <input id="page-input" type="number" min="1" class="page-input" aria-label="Go to page" />
            <span class="page-total"> / <span id="page-total">0</span></span>
            <input id="page-slider" type="range" min="0" max="100" value="0" class="page-slider" aria-label="Progress" />
          </div>
        </div>
      </div>

      <div class="reader-body">
        <aside id="toc-panel" class="toc-panel">
          <section class="panel-acc" data-acc="toc">
            <button class="panel-acc-header" type="button" aria-expanded="true" aria-controls="toc-body">
              <span data-i18n="toc.title">Table of Contents</span><span class="panel-acc-caret" aria-hidden="true"></span>
            </button>
            <div id="toc-body" class="panel-acc-body">
              <div id="toc-list"><p class="empty" data-i18n="toc.empty">TOC not available for this format yet.</p></div>
            </div>
          </section>
          <section class="panel-acc panel-section" data-acc="bookmarks">
            <button class="panel-acc-header" type="button" aria-expanded="false" aria-controls="bookmark-body">
              <span data-i18n="bookmarks.title">Bookmarks</span><span class="panel-acc-caret" aria-hidden="true"></span>
            </button>
            <div id="bookmark-body" class="panel-acc-body" hidden>
              <div id="bookmark-list"><p class="empty" data-i18n="bookmarks.empty">No bookmarks yet.</p></div>
            </div>
          </section>
          <section class="panel-acc panel-section" data-acc="highlights">
            <button class="panel-acc-header" type="button" aria-expanded="false" aria-controls="highlights-body">
              <span data-i18n="highlights.title">Highlights</span><span class="panel-acc-caret" aria-hidden="true"></span>
            </button>
            <div id="highlights-body" class="panel-acc-body" hidden>
              <div id="highlight-list"><p class="empty" data-i18n="highlights.empty">No highlights yet. Select text to mark it.</p></div>
            </div>
          </section>
          <section class="panel-acc panel-section" data-acc="search">
            <button class="panel-acc-header" type="button" aria-expanded="false" aria-controls="search-body">
              <span data-i18n="search.title">Search</span><span class="panel-acc-caret" aria-hidden="true"></span>
            </button>
            <div id="search-body" class="panel-acc-body" hidden>
              <div class="search-row">
                <input id="search-input" type="text" class="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search in this book&#8230;" />
                <button id="search-btn" class="btn search-btn" type="button" data-i18n="search.button">Search</button>
              </div>
              <div id="search-results"></div>
            </div>
          </section>
        </aside>
        <div id="book-container" class="reader-content"></div>
      </div>

      <!-- Mobile-only bottom page-turn bar (desktop: hidden via CSS) -->
      <nav id="mobile-nav" class="mobile-nav" aria-label="Page navigation">
        <button id="prev-btn-bottom" class="mobile-nav-btn" type="button" aria-label="Previous page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="next-btn-bottom" class="mobile-nav-btn" type="button" aria-label="Next page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>
    </section>

  </main>

  <!-- Drag & drop overlay (text is injected via i18n) -->
  <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
    <div class="drop-overlay-card">
      <svg class="drop-overlay-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>
      </svg>
      <span class="drop-overlay-text" data-i18n="reader.drop_here"></span>
    </div>
  </div>

  <!-- CDN libraries -->
  <script src="js/pdf-library.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js" integrity="sha512-qZUwAZnQNbTGK3xweH0p9dJ0/FflhdJwGr5IhvhuBtltqdTi6G8TjsAf8WINe3uhhyt2wueXacvXtQtOiHm26Q==" crossorigin="anonymous"></script>

  <!-- App scripts (classic dependency order; PDF ESM is initialized lazily with a file-URL bridge) -->
  <script src="js/storage.js"></script>
  <script src="js/file-loader.js"></script>
  <script src="js/search.js"></script>
  <script src="js/highlights-dom.js"></script>
  <script src="js/renderers/text.js"></script>
  <script src="js/renderers/pdf.js"></script>
  <script src="js/renderers/epub.js"></script>
  <script src="js/renderers/comic.js"></script>
  <script src="js/renderers/fb2.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/stored-books.js"></script>
  <script src="js/covers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
